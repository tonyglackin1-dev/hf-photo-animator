<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>HF Photo Animator</title><style>body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;padding:20px}.wrap{max-width:900px;margin:auto}.stage{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}.stage img{width:100%;height:100%;object-fit:cover;display:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}button,select,input{padding:12px;border-radius:10px;border:1px solid #444;background:#1d1d1d;color:#fff}button{cursor:pointer}.full{grid-column:1/-1}@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.2)}}@keyframes pull{from{transform:scale(1.25)}to{transform:scale(1)}}@keyframes left{from{transform:scale(1.15) translateX(5%)}to{transform:scale(1.15) translateX(-5%)}}@keyframes right{from{transform:scale(1.15) translateX(-5%)}to{transform:scale(1.15) translateX(5%)}}</style></head><body><div class='wrap'><h1>HF Photo Animator</h1><p>Local browser prototype — no upload, no API.</p><div class='stage'><span id='empty'>Choose a photo</span><img id='img'></div><div class='controls'><input class='full' id='file' type='file' accept='image/*'><select id='effect'><option value='zoom'>Cinematic Zoom</option><option value='pull'>Drone Pull-back</option><option value='left'>Pan Left</option><option value='right'>Pan Right</option></select><select id='duration'><option value='4'>4 sec</option><option value='6' selected>6 sec</option><option value='8'>8 sec</option></select><button class='full' id='go' disabled>Animate Photo</button></div><p id='status'>Waiting for photo.</p></div><script>const f=document.getElementById('file'),i=document.getElementById('img'),e=document.getElementById('effect'),d=document.getElementById('duration'),g=document.getElementById('go'),s=document.getElementById('status'),empty=document.getElementById('empty');f.onchange=()=>{const x=f.files&&f.files[0];if(!x)return;const r=new FileReader();r.onload=()=>{i.src=r.result;i.style.display='block';empty.style.display='none';g.disabled=false;s.textContent='Photo loaded.'};r.readAsDataURL(x)};g.onclick=()=>{i.style.animation='none';void i.offsetWidth;i.style.animation=`${e.value} ${d.value}s ease-in-out forwards`;s.textContent='Animating locally...'};i.onanimationend=()=>s.textContent='Done.';</script></body></html>
