name: MemoryAlive
options:
  bundleIdPrefix: com.tonyglackin
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    DEVELOPMENT_TEAM: ""
targets:
  MemoryAlive:
    type: application
    platform: iOS
    sources:
      - path: MemoryAlive
    resources:
      - path: MemoryAlive/Models
    info:
      path: MemoryAlive/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonyglackin.memoryalive
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
