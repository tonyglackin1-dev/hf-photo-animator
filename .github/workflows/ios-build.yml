name: iOS Native Build

on:
  push:
    branches: ["main"]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen and ffmpeg
        run: |
          brew install xcodegen
          brew install ffmpeg

      - name: Fetch Real-ESRGAN Core ML model
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p MemoryAlive/Models
          curl -L --fail --retry 3 \
            -o /tmp/RealESRGAN_general_522_fp16.zip \
            https://github.com/hanxiao/real-esrgan-coreml/releases/download/v1.0.0/RealESRGAN_general_522_fp16.zip
          unzip -q /tmp/RealESRGAN_general_522_fp16.zip -d MemoryAlive/Models
          test -d MemoryAlive/Models/RealESRGAN_general_522_fp16.mlpackage

      - name: Fetch DDColor Core ML model
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p MemoryAlive/Models
          curl -L --fail --retry 3 \
            -o /tmp/DDColor_Tiny.mlpackage.zip \
            https://github.com/john-rocky/CoreML-Models/releases/download/ddcolor-v1/DDColor_Tiny.mlpackage.zip
          unzip -q /tmp/DDColor_Tiny.mlpackage.zip -d MemoryAlive/Models
          test -d MemoryAlive/Models/DDColor_Tiny.mlpackage

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Show schemes
        working-directory: ios
        run: xcodebuild -list -project MemoryAlive.xcodeproj

      - name: Build for iPhone Simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project MemoryAlive.xcodeproj \
            -scheme MemoryAlive \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath /tmp/MemoryAliveDerived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator and capture visual demo
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl create "MemoryAlive CI" "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro" "com.apple.CoreSimulator.SimRuntime.iOS-18-5")
          cleanup() {
            xcrun simctl shutdown "$DEVICE_ID" >/dev/null 2>&1 || true
            xcrun simctl delete "$DEVICE_ID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          xcrun simctl boot "$DEVICE_ID"

          READY=0
          for i in $(seq 1 60); do
            STATE=$(xcrun simctl list devices | grep "$DEVICE_ID" || true)
            if echo "$STATE" | grep -q "(Booted)"; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "Simulator did not reach Booted state within 120 seconds"
            exit 1
          fi

          xcrun simctl install "$DEVICE_ID" /tmp/MemoryAliveDerived/Build/Products/Debug-iphonesimulator/MemoryAlive.app
          mkdir -p /tmp/memory-alive-proof

          SIMCTL_CHILD_MEMORY_ALIVE_DEMO_IMAGE_URL="https://commons.wikimedia.org/wiki/Special:Redirect/file/HardingLooksBowtie.jpg" \
          SIMCTL_CHILD_MEMORY_ALIVE_DEMO_ACTION="animate" \
          xcrun simctl launch "$DEVICE_ID" com.tonyglackin.memoryalive

          sleep 10
          xcrun simctl io "$DEVICE_ID" screenshot /tmp/memory-alive-proof/bring-to-life.png

          RAW_VIDEO=/tmp/memory-alive-proof/bring-to-life-raw.mp4
          FINAL_VIDEO=/tmp/memory-alive-proof/bring-to-life.mp4

          echo "Recording 6-second Bring to Life proof video"
          xcrun simctl io "$DEVICE_ID" recordVideo --codec=h264 --force "$RAW_VIDEO" >/tmp/recordvideo.log 2>&1 &
          RECORDER_PID=$!
          sleep 6
          kill -INT "$RECORDER_PID" >/dev/null 2>&1 || true

          for i in $(seq 1 30); do
            if ! kill -0 "$RECORDER_PID" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          if kill -0 "$RECORDER_PID" >/dev/null 2>&1; then
            echo "recordVideo failed to exit cleanly after SIGINT"
            cat /tmp/recordvideo.log || true
            exit 1
          fi

          wait "$RECORDER_PID" || true
          cat /tmp/recordvideo.log || true

          test -s /tmp/memory-alive-proof/bring-to-life.png
          test -s "$RAW_VIDEO"

          echo "Validating raw simulator video"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$RAW_VIDEO"

          echo "Remuxing MP4 for broad playback compatibility"
          ffmpeg -y -v error -i "$RAW_VIDEO" -c copy -movflags +faststart "$FINAL_VIDEO"
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of default=noprint_wrappers=1 "$FINAL_VIDEO"
          test -s "$FINAL_VIDEO"

          rm -f "$RAW_VIDEO"
          ls -lh /tmp/memory-alive-proof

      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-alive-simulator-proof
          path: /tmp/memory-alive-proof/
          if-no-files-found: error
