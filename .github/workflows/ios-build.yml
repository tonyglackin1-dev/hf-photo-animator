name: iOS Native Build

on:
  push:
    branches: ["main"]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Show schemes
        working-directory: ios
        run: xcodebuild -list -project MemoryAlive.xcodeproj

      - name: Build for iPhone Simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project MemoryAlive.xcodeproj \
            -scheme MemoryAlive \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
